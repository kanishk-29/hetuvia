services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hetuvia
      POSTGRES_PASSWORD: hetuvia_dev
      POSTGRES_DB: hetuvia
    ports:
      - "5432:5432"
    volumes:
      - hetuvia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hetuvia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hetuvia_pgdata: